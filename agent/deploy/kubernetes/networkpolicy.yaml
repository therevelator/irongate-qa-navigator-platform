# No ingress at all; egress only to DNS and TCP 443. Narrow 443 further to the addresses of QE Navigator
# (app.irongate.ie), your proxy and your Jira / Linear / PagerDuty / Opsgenie if your CNI supports FQDN rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qe-agent
spec:
  podSelector:
    matchLabels:
      app: qe-agent
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
