[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Secrets scanning configuration
[build.processing]
  skip_processing = false

[build.processing.secrets]
  # Omit documentation files from secrets scanning
  omit_paths = [
    "docs/**/*.md",
    "*.md",
    "**/*.sh",
    ".env",
    ".env.*"
  ]

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "bcrypt"]

# Redirect API calls to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback - serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Development settings
[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  autoLaunch = false

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Password reset page: its address carried a one-time token, so no Referer at all (the page also
# removes the token from the address bar and adds <meta name="referrer" content="no-referrer">).
[[headers]]
  for = "/reset-password"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# The self-serve demo (/try, server/lib/sandbox.ts) is never indexed.
[[headers]]
  for = "/try"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should never be cached long-term
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
