name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Local Postgres service only (never a remote database).
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/irongate_qa
  DB_HOST: 127.0.0.1
  DB_PORT: '5432'
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: irongate_qa
  JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
  API_RATE_LIMIT_MAX: '10000'
  LOG_DIR: /tmp/irongate-ci-logs

jobs:
  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-24.04  # Playwright 1.57 has no browser builds for ubuntu-latest (26.04) yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Typecheck server
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Calculation engine (typecheck, purity and unit tests)
        run: npx tsc --noEmit -p packages/engine/tsconfig.json && node --import tsx --test packages/engine/test/*.test.ts

      - name: QE Navigator Collector (typecheck, bundle, tests, allow-list drift)
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run typecheck && npm test && npm run check-allow-list

      - name: Lint (report only, existing lint debt does not fail the build)
        run: |
          npx eslint . -f json -o eslint-report.json || true
          node scripts/ci/lint-summary.mjs eslint-report.json

      - name: Build
        run: npm run build

  api-and-db:
    name: API and database tests
    runs-on: ubuntu-24.04  # Playwright 1.57 has no browser builds for ubuntu-latest (26.04) yet
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: irongate_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irongate_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up database and API
        uses: ./.github/actions/setup-test-env

      - name: Build the QE Navigator Collector (its end-to-end tests run the bundle)
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build

      - name: API tests
        run: npx jest --config jest.config.cjs tests/api --ci

      - name: Database tests
        run: npx jest --config jest.config.cjs tests/database --ci

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: api-and-db-logs
          path: /tmp/irongate-ci-logs/
          retention-days: 14

  # Fast gate on every push: the @smoke subset of the UI suite. The full suite (sharded, nightly,
  # pull requests, main) is the "UI tests" workflow (.github/workflows/ui-tests.yml).
  e2e:
    name: End-to-end smoke (Playwright @smoke)
    runs-on: ubuntu-24.04  # Playwright 1.57 has no browser builds for ubuntu-latest (26.04) yet
    timeout-minutes: 25
    env:
      # The log mailer also writes each e-mail here (development aid), so the tests can follow
      # the links in invitation, pulse and password reset e-mails.
      MAIL_CAPTURE_FILE: /tmp/irongate-ci-logs/mail.jsonl
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: irongate_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irongate_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up database, API and web app
        uses: ./.github/actions/setup-test-env
        with:
          start-web: 'true'

      - name: Install Playwright Chromium
        # The runner image already has Chrome's system libraries; the apt step of --with-deps is
        # only needed (and only run) when the browser cannot start without it (apt mirrors are slow).
        run: |
          npx playwright install chromium
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" \
            || npx playwright install-deps chromium

      - name: E2E smoke tests
        run: npx playwright test --project=chromium --grep @smoke --reporter=list,html
        env:
          PW_WORKERS: '3'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results and service logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-and-logs
          path: |
            test-results/
            /tmp/irongate-ci-logs/
          retention-days: 14
