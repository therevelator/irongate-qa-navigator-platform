# qe-collector as a Kubernetes CronJob: every 15 minutes, one run at a time, non-root, read-only root file
# system, no capabilities, no service account token, egress only (see networkpolicy.yaml).
#
#   kubectl create namespace qe-collector
#   kubectl -n qe-collector create secret generic qe-collector-secrets \
#     --from-literal=QE_API_KEY=igk_... --from-literal=JIRA_TOKEN=... --from-literal=JIRA_EMAIL=svc@example.com
#   kubectl -n qe-collector create configmap qe-collector-config --from-file=qe-collector.yaml
#   kubectl -n qe-collector apply -f cronjob.yaml -f networkpolicy.yaml
#   kubectl -n qe-collector create job --from=cronjob/qe-collector qe-collector-manual   # run once now
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qe-collector-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qe-collector
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid          # never two runs at once (the Collector also takes a lock)
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0                # the next schedule retries; exit codes say why a run failed
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app: qe-collector
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: qe-collector
              image: qe-collector:0.2.0      # your registry copy, pinned by digest: registry.example.com/qe-collector@sha256:…
              imagePullPolicy: IfNotPresent
              args: ["sync", "--log-format", "json"]
              envFrom:
                - secretRef:
                    name: qe-collector-secrets
              env:
                - name: QE_COLLECTOR_CONFIG
                  value: /etc/qe-collector/qe-collector.yaml
                # Outbound proxy, if any (NO_PROXY: your internal Jira and the cluster):
                # - name: HTTPS_PROXY
                #   value: http://proxy.internal.example.com:3128
                # - name: NO_PROXY
                #   value: .internal.example.com,.svc.cluster.local
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              volumeMounts:
                - name: config
                  mountPath: /etc/qe-collector
                  readOnly: true
                - name: state
                  mountPath: /var/lib/qe-collector
          volumes:
            - name: config
              configMap:
                name: qe-collector-config
            - name: state
              persistentVolumeClaim:
                claimName: qe-collector-state
