# Postgres for the UI tests on this computer (npm run test:ui:local starts and stops it).
# Port 55432, so it never clashes with a Postgres you already run on 5432. Data lives in memory
# (tmpfs): every start is a clean database.
name: irongate-ui-tests
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
