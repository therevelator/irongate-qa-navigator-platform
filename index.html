<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QE Navigator</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Appearance before the first paint (no flash): mirrors applyTheme(), applyScoreDisplay(), applyScoreDepth() and applyBatteryStyle() in src/lib/appearance.ts. -->
    <script>
      (function () {
        var d = document.documentElement, t = 'light', s = 'battery', z = '3d', b = 'cell';
        try {
          var p = localStorage.getItem('irongate_theme_mode');
          if (p === 'system') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          else if (p === 'dark' || p === 'graphite' || p === 'porcelain' || p === 'light') t = p;
          if (localStorage.getItem('irongate_score_display') === 'gauge') s = 'gauge';
          if (localStorage.getItem('irongate_score_depth') === '2d') z = '2d';
          if (localStorage.getItem('irongate_battery_style') === 'liquid') b = 'liquid';
          // Signed-out screens keep the classic Light look (see AuthWrapper); the operator panel follows the choice.
          var op = location.pathname === '/operator' || location.pathname.indexOf('/operator/') === 0;
          if (!op && localStorage.getItem('irongate_signed_in') !== '1') t = 'light';
        } catch (e) { /* storage unavailable: defaults */ }
        var dark = t === 'dark' || t === 'graphite';
        d.setAttribute('data-theme', t);
        d.classList.toggle('dark', dark);
        d.style.colorScheme = dark ? 'dark' : 'light';
        d.setAttribute('data-score-display', s);
        d.setAttribute('data-score-depth', z);
        d.setAttribute('data-battery-style', b);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome for notification icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
